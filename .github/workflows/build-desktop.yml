name: Build Desktop Release (Windows & macOS)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri App
        run: npx tauri build

      - name: Prepare & Rename Release Assets (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets

          rm -rf /tmp/dmg_build && mkdir -p /tmp/dmg_build
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" /tmp/dmg_build/
          fi
          if [ -f "src-tauri/README.txt" ]; then
            cp "src-tauri/README.txt" /tmp/dmg_build/
          fi
          ln -s /Applications /tmp/dmg_build/Applications
          hdiutil create -volname "AstroStar" -srcfolder /tmp/dmg_build -ov -format UDZO "dist-assets/AstroStar-v${VERSION}-macOS-arm64.dmg"
          rm -rf /tmp/dmg_build

          if [ -n "$APP_PATH" ]; then
            tar -czf "dist-assets/AstroStar-v${VERSION}-macOS-arm64.app.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          fi

      - name: Prepare & Rename Release Assets (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} "dist-assets/AstroStar-v${VERSION}-Windows-x64-Setup.exe" \;
          find src-tauri/target/release/bundle/msi -name "*.msi" -exec cp {} "dist-assets/AstroStar-v${VERSION}-Windows-x64.msi" \;

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
